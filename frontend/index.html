<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack — Portfolio Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { color: white; font-size: 28px; }
        h2 { font-size: 20px; margin-bottom: 16px; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #764ba2; }
        button.secondary {
            background: #e0e0e0;
            color: #333;
        }
        button.secondary:hover { background: #d0d0d0; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .error { color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; margin-bottom: 12px; }
        .success { color: #388e3c; padding: 12px; background: #e8f5e9; border-radius: 6px; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .stat {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 12px; color: #666; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; color: #667eea; margin: 8px 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f5f5f5;
            font-weight: 600;
        }
        tr:hover { background: #f9f9f9; }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab {
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .nav {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .nav button { flex: 1; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mini-btn {
            background: #f5f5f5;
            color: #333;
            padding: 6px 12px;
            font-size: 12px;
        }
        .mini-btn:hover { background: #e0e0e0; }
        .error-banner { color: #d32f2f; padding: 10px; background: #ffebee; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="authView" class="card" style="display: none;">
            <h1 style="color: #333; margin-bottom: 20px;">FinTrack Login</h1>
            <div id="authError" class="error" style="display: none;"></div>
            <input id="authEmail" type="email" placeholder="Email">
            <input id="authPassword" type="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button class="secondary" onclick="toggleRegister()">Sign Up</button>
            <div id="regForm" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
                <input id="regEmail" type="email" placeholder="Email">
                <input id="regPassword" type="password" placeholder="Password">
                <input id="regFirstName" type="text" placeholder="First Name">
                <input id="regLastName" type="text" placeholder="Last Name">
                <input id="regDob" type="date" placeholder="Date of Birth">
                <select id="regRisk">
                    <option value="">Select Risk Tolerance</option>
                    <option value="conservative">Conservative</option>
                    <option value="moderate">Moderate</option>
                    <option value="aggressive">Aggressive</option>
                </select>
                <button onclick="register()">Create Account</button>
            </div>
        </div>

        <div id="appView" style="display: none;">
            <div class="header">
                <h1>FinTrack</h1>
                <button onclick="logout()">Logout</button>
            </div>

            <div class="card">
                <div class="grid">
                    <div class="stat">
                        <div class="stat-label">Total Assets</div>
                        <div class="stat-value" id="totalAssets">$0.00</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Monthly Budget</div>
                        <div class="stat-value" id="totalBudget">$0.00</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">HYSA Balance</div>
                        <div class="stat-value" id="totalHysa">$0.00</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Stock Value</div>
                        <div class="stat-value" id="totalStocks">$0.00</div>
                    </div>
                </div>
                <button onclick="recordSnapshot()" style="margin-top: 16px; width: 100%;">📸 Record Snapshot</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('budgets')">Budgets</button>
                <button class="tab" onclick="switchTab('hysa')">HYSA</button>
                <button class="tab" onclick="switchTab('stocks')">Stocks</button>
                <button class="tab" onclick="switchTab('settings')">Settings</button>
            </div>

            <!-- Budgets Tab -->
            <div id="budgetsTab" class="card" style="display: block;">
                <h2>Budgets</h2>
                <select id="budgetYear" onchange="loadBudgetYear()">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
                <div id="budgetList"></div>
                <input id="budgetItem" placeholder="Item (e.g., Rent)">
                <input id="budgetAmount" type="number" placeholder="Amount">
                <select id="budgetFreq">
                    <option value="monthly">Monthly</option>
                    <option value="weekly">Weekly</option>
                    <option value="custom">Custom</option>
                </select>
                <button onclick="addBudgetItem()">Add Item</button>
                <button class="secondary" onclick="saveBudgets()" style="margin-top: 12px; width: 100%;">💾 Save</button>
            </div>

            <!-- HYSA Tab -->
            <div id="hysaTab" class="card" style="display: none;">
                <h2>High-Yield Savings Accounts</h2>
                <div id="hysaList"></div>
                <input id="hysaName" placeholder="Account Name">
                <input id="hysaBalance" type="number" placeholder="Balance" step="0.01">
                <input id="hysaRate" type="number" placeholder="APY %" step="0.01">
                <select id="hysaCompound">
                    <option value="365">Daily (365x/yr)</option>
                    <option value="52">Weekly (52x/yr)</option>
                    <option value="12">Monthly (12x/yr)</option>
                    <option value="4">Quarterly (4x/yr)</option>
                    <option value="1">Annually (1x/yr)</option>
                </select>
                <button onclick="addHysaAccount()">Add Account</button>
                <button class="secondary" onclick="saveHysa()" style="margin-top: 12px; width: 100%;">💾 Save</button>
            </div>

            <!-- Stocks Tab -->
            <div id="stocksTab" class="card" style="display: none;">
                <h2>Stock Holdings</h2>
                <div id="stocksList"></div>
                <input id="stockTicker" placeholder="Ticker (e.g., SCHB)">
                <input id="stockShares" type="number" placeholder="Shares" step="0.001">
                <input id="stockPrice" type="number" placeholder="Cost per Share" step="0.01">
                <input id="stockDate" type="date">
                <select id="stockAccount">
                    <option value="taxable">Taxable</option>
                    <option value="401k">401(k)</option>
                    <option value="ira">IRA</option>
                    <option value="hsa">HSA</option>
                </select>
                <button onclick="searchStock()">🔍 Lookup Price</button>
                <button onclick="addStock()">Add Holding</button>
                <button class="secondary" onclick="saveStocks()" style="margin-top: 12px; width: 100%;">💾 Save</button>
            </div>

            <!-- Settings Tab -->
            <div id="settingsTab" class="card" style="display: none;">
                <h2>Settings</h2>
                <input id="settingsFirstName" placeholder="First Name">
                <input id="settingsLastName" placeholder="Last Name">
                <input id="settingsDob" type="date">
                <select id="settingsRisk">
                    <option value="conservative">Conservative</option>
                    <option value="moderate">Moderate</option>
                    <option value="aggressive">Aggressive</option>
                </select>
                <h3 style="margin-top: 20px; margin-bottom: 12px;">Change Password</h3>
                <input id="settingsOldPassword" type="password" placeholder="Current Password">
                <input id="settingsNewPassword" type="password" placeholder="New Password">
                <button onclick="changePassword()">Update Password</button>
                <button class="secondary" onclick="saveSettings()" style="margin-top: 12px; width: 100%;">💾 Save</button>
            </div>
        </div>
    </div>

    <script>
        // === STATE ===
        let sUser = () => JSON.parse(localStorage.getItem("USER") || "{}");
        let sBudgets = () => JSON.parse(localStorage.getItem("BUDGETS") || "{}");
        let sHysa = () => JSON.parse(localStorage.getItem("HYSA") || "{}");
        let sStocks = () => JSON.parse(localStorage.getItem("STOCKS") || "{}");
        let sSettings = () => JSON.parse(localStorage.getItem("SETTINGS") || "{}");
        let sSnaps = () => JSON.parse(localStorage.getItem("SNAPSHOTS") || "[]");

        const updateState = (key, value) => localStorage.setItem(key, JSON.stringify(value));

        // === API ===
        const apiRequest = async (method, path, body = null) => {
            const token = localStorage.getItem("API_TOKEN");
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;
            const cfg = { method, headers };
            if (body) cfg.body = JSON.stringify(body);
            
            // Use window.location.origin to get the actual host (e.g., http://localhost:8080)
            // Then replace :8080 with :8000 for backend access
            // OR use relative /api which Nginx proxies
            const baseUrl = '/api';
            
            const r = await fetch(`${baseUrl}${path}`, cfg);
            if (!r.ok) {
                if (r.status === 401) {
                    // Token expired, try refresh
                    const refreshed = await refreshToken();
                    if (refreshed) return apiRequest(method, path, body);  // Retry
                    showError("Session expired. Please log in again.");
                    logout();
                    throw new Error("Unauthorized");
                }
                throw new Error(`API error: ${r.status}`);
            }
            return await r.json();
        };

        // === AUTH ===
        const refreshToken = async () => {
            try {
                const token = localStorage.getItem("REFRESH_TOKEN");
                if (!token) return false;
                const baseUrl = '/api';
                const r = await fetch(`${baseUrl}/auth/refresh`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!r.ok) return false;
                const resp = await r.json();
                localStorage.setItem("API_TOKEN", resp.access_token);
                return true;
            } catch (e) {
                return false;
            }
        };

        const toggleRegister = () => {
            document.getElementById("regForm").style.display = 
                document.getElementById("regForm").style.display === "none" ? "block" : "none";
        };

        const login = async (email, password) => {
            const e = document.getElementById("authEmail").value || email;
            const p = document.getElementById("authPassword").value || password;
            try {
                const ud = await apiRequest("POST", "/auth/login", { email: e, password: p });
                if (!ud?.access_token) throw new Error("No token in response");
                
                localStorage.setItem("API_TOKEN", ud.access_token);
                localStorage.setItem("REFRESH_TOKEN", ud.refresh_token);
                
                // Hydrate from login response
                const userData = ud.user;
                if (userData) {
                    updateState("USER", {
                        id: userData.id,
                        email: userData.email,
                        first_name: userData.first_name,
                        last_name: userData.last_name,
                        dob: userData.date_of_birth,
                        risk: userData.risk_tolerance
                    });
                }
                
                document.getElementById("authView").style.display = "none";
                document.getElementById("appView").style.display = "block";
                
                await hydrate();
                updateDashboard();
            } catch (e) {
                showError(e.message);
            }
        };

        const register = async () => {
            try {
                const email = document.getElementById("regEmail").value;
                const password = document.getElementById("regPassword").value;
                const first_name = document.getElementById("regFirstName").value;
                const last_name = document.getElementById("regLastName").value;
                const date_of_birth = document.getElementById("regDob").value;
                const risk_tolerance = document.getElementById("regRisk").value;
                
                await apiRequest("POST", "/auth/register", {
                    email, password, first_name, last_name, date_of_birth, risk_tolerance
                });
                
                // Auto-login after registration
                await login(email, password);
            } catch (e) {
                showError(e.message);
            }
        };

        const logout = () => {
            localStorage.removeItem("API_TOKEN");
            localStorage.removeItem("REFRESH_TOKEN");
            localStorage.removeItem("USER");
            document.getElementById("authView").style.display = "block";
            document.getElementById("appView").style.display = "none";
        };

        // === DATA HYDRATION ===
        const hydrate = async () => {
            try {
                const d = await apiRequest("GET", "/data");
                if (!d) return;
                updateState("BUDGETS", d.budgets || {});
                updateState("HYSA", d.hysa || {});
                updateState("STOCKS", d.stocks || {});
                updateState("SETTINGS", d.settings || {});
            } catch (e) {
                console.warn("Hydrate fallback: using local data");
            }
        };

        // === BUDGETS ===
        const loadBudgetYear = () => {
            const year = document.getElementById("budgetYear").value;
            const budgets = sBudgets();
            const items = budgets[year] || [];
            const html = items.map((item, i) => `
                <div style="padding: 10px; background: #f5f5f5; margin: 8px 0; border-radius: 6px;">
                    <strong>${item.item}</strong>: $${item.amount} (${item.type || item.frequency})
                    <button class="mini-btn" onclick="delBudgetItem(${i})">Delete</button>
                </div>
            `).join("");
            document.getElementById("budgetList").innerHTML = html || "<p>No items yet</p>";
        };

        const addBudgetItem = () => {
            const year = document.getElementById("budgetYear").value;
            const item = document.getElementById("budgetItem").value;
            const amount = parseFloat(document.getElementById("budgetAmount").value);
            const freq = document.getElementById("budgetFreq").value;
            
            const budgets = sBudgets();
            if (!budgets[year]) budgets[year] = [];
            budgets[year].push({ item, amount, type: freq, frequency: freq });
            updateState("BUDGETS", budgets);
            loadBudgetYear();
            document.getElementById("budgetItem").value = "";
            document.getElementById("budgetAmount").value = "";
        };

        const delBudgetItem = (i) => {
            const year = document.getElementById("budgetYear").value;
            const budgets = sBudgets();
            budgets[year].splice(i, 1);
            updateState("BUDGETS", budgets);
            loadBudgetYear();
        };

        const saveBudgets = async () => {
            try {
                const bud = sBudgets();
                // Try bulk endpoint first
                try {
                    await apiRequest("PUT", "/data/budgets", { budgets: bud });
                } catch (e) {
                    // Fallback to granular
                    for (const year in bud) {
                        const items = bud[year].map(item => ({
                            ...item,
                            frequency: item.type || item.frequency
                        }));
                        await apiRequest("PUT", `/budgets/${year}`, { items });
                    }
                }
                showSuccess("Budgets saved");
            } catch (e) {
                showError(e.message);
            }
        };

        // === HYSA ===
        const addHysaAccount = () => {
            const name = document.getElementById("hysaName").value;
            const balance = parseFloat(document.getElementById("hysaBalance").value);
            const rate = parseFloat(document.getElementById("hysaRate").value);
            const compounding = parseInt(document.getElementById("hysaCompound").value);
            
            const hysa = sHysa();
            const id = Date.now().toString();
            hysa[id] = { id, name, balance, apy: rate, compounding };
            updateState("HYSA", hysa);
            loadHysaList();
            document.getElementById("hysaName").value = "";
            document.getElementById("hysaBalance").value = "";
            document.getElementById("hysaRate").value = "";
        };

        const loadHysaList = () => {
            const hysa = sHysa();
            const html = Object.values(hysa).map(h => `
                <div style="padding: 10px; background: #f5f5f5; margin: 8px 0; border-radius: 6px;">
                    <strong>${h.name}</strong>: $${h.balance.toFixed(2)} @ ${h.apy}% APY
                    <button class="mini-btn" onclick="delHysa('${h.id}')">Delete</button>
                </div>
            `).join("");
            document.getElementById("hysaList").innerHTML = html || "<p>No accounts yet</p>";
        };

        const delHysa = (id) => {
            const hysa = sHysa();
            delete hysa[id];
            updateState("HYSA", hysa);
            loadHysaList();
        };

        const saveHysa = async () => {
            try {
                const hysa = sHysa();
                await apiRequest("PUT", "/data/hysa", { hysa });
                showSuccess("HYSA saved");
            } catch (e) {
                showError(e.message);
            }
        };

        // === STOCKS ===
        const searchStock = async () => {
            const ticker = document.getElementById("stockTicker").value;
            try {
                const resp = await apiRequest("GET", `/ticker/lookup?q=${ticker}`);
                if (resp?.result) {
                    document.getElementById("stockPrice").value = (resp.result.price || resp.result.regularMarketPrice || 0).toFixed(2);
                }
            } catch (e) {
                showError("Stock lookup failed: " + e.message);
            }
        };

        const addStock = () => {
            const ticker = document.getElementById("stockTicker").value.toUpperCase();
            const shares = parseFloat(document.getElementById("stockShares").value);
            const price = parseFloat(document.getElementById("stockPrice").value);
            const date = document.getElementById("stockDate").value;
            const account = document.getElementById("stockAccount").value;
            
            const stocks = sStocks();
            const id = Date.now().toString();
            stocks[id] = { 
                id, ticker, shares, price, date, account,
                account_type: account  // Normalize for backend
            };
            updateState("STOCKS", stocks);
            loadStocksList();
            document.getElementById("stockTicker").value = "";
            document.getElementById("stockShares").value = "";
            document.getElementById("stockPrice").value = "";
        };

        const loadStocksList = () => {
            const stocks = sStocks();
            const html = Object.values(stocks).map(s => `
                <div style="padding: 10px; background: #f5f5f5; margin: 8px 0; border-radius: 6px;">
                    <strong>${s.ticker}</strong>: ${s.shares} shares @ $${s.price} (${s.account})
                    <button class="mini-btn" onclick="delStock('${s.id}')">Delete</button>
                </div>
            `).join("");
            document.getElementById("stocksList").innerHTML = html || "<p>No holdings yet</p>";
        };

        const delStock = (id) => {
            const stocks = sStocks();
            delete stocks[id];
            updateState("STOCKS", stocks);
            loadStocksList();
        };

        const saveStocks = async () => {
            try {
                const stocks = Object.values(sStocks()).map(s => ({
                    ...s,
                    account_type: s.account || s.account_type
                }));
                await apiRequest("PUT", "/data/stocks", { stocks });
                showSuccess("Stocks saved");
            } catch (e) {
                showError(e.message);
            }
        };

        // === SETTINGS ===
        const changePassword = async () => {
            try {
                const oldPw = document.getElementById("settingsOldPassword").value;
                const newPw = document.getElementById("settingsNewPassword").value;
                await apiRequest("PUT", "/auth/password", {
                    old_password: oldPw,
                    new_password: newPw
                });
                showSuccess("Password updated");
                document.getElementById("settingsOldPassword").value = "";
                document.getElementById("settingsNewPassword").value = "";
            } catch (e) {
                showError("Password change failed: " + e.message);
            }
        };

        const saveSettings = async () => {
            try {
                const user = sUser();
                const settings = {
                    first_name: document.getElementById("settingsFirstName").value || user.first_name,
                    last_name: document.getElementById("settingsLastName").value || user.last_name,
                    date_of_birth: document.getElementById("settingsDob").value,
                    risk_tolerance: document.getElementById("settingsRisk").value
                };
                await apiRequest("PUT", "/users/profile", settings);
                updateState("USER", { ...user, ...settings });
                showSuccess("Settings updated");
            } catch (e) {
                showError(e.message);
            }
        };

        // === SNAPSHOTS ===
        const recordSnapshot = async () => {
            const snap = {
                date: new Date().toISOString(),
                total: calcTotal(),
                budgets: sBudgets(),
                hysa: sHysa(),
                stocks: sStocks()
            };
            const snaps = sSnaps();
            snaps.push(snap);
            updateState("SNAPSHOTS", snaps);
            
            // Sync to backend
            try {
                await apiRequest("POST", "/snapshots", snap);
            } catch (e) {
                console.warn("Failed to sync snapshot to backend:", e.message);
            }
            showSuccess("Snapshot recorded");
        };

        // === UI ===
        const switchTab = (tab) => {
            document.querySelectorAll(".card").forEach(c => c.style.display = "none");
            document.getElementById(tab + "Tab").style.display = "block";
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            event.target.classList.add("active");
        };

        const calcTotal = () => {
            const hysa = Object.values(sHysa()).reduce((s, h) => s + h.balance, 0);
            const stocks = Object.values(sStocks()).reduce((s, st) => s + (st.shares * st.price), 0);
            return hysa + stocks;
        };

        const updateDashboard = () => {
            document.getElementById("totalAssets").textContent = "$" + calcTotal().toFixed(2);
            const budgets = Object.values(sBudgets()).flat();
            const budgetTotal = budgets.reduce((s, b) => s + (b.amount || 0), 0);
            document.getElementById("totalBudget").textContent = "$" + budgetTotal.toFixed(2);
            const hysaTotal = Object.values(sHysa()).reduce((s, h) => s + h.balance, 0);
            document.getElementById("totalHysa").textContent = "$" + hysaTotal.toFixed(2);
            const stocksTotal = Object.values(sStocks()).reduce((s, st) => s + (st.shares * st.price), 0);
            document.getElementById("totalStocks").textContent = "$" + stocksTotal.toFixed(2);
        };

        const showError = (msg) => {
            const div = document.getElementById("authError");
            div.textContent = msg;
            div.style.display = "block";
            setTimeout(() => div.style.display = "none", 5000);
        };

        const showSuccess = (msg) => {
            const div = document.createElement("div");
            div.className = "success";
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        };

        // === INIT ===
        window.addEventListener("load", () => {
            const token = localStorage.getItem("API_TOKEN");
            if (token) {
                document.getElementById("authView").style.display = "none";
                document.getElementById("appView").style.display = "block";
                hydrate().then(() => {
                    loadBudgetYear();
                    loadHysaList();
                    loadStocksList();
                    updateDashboard();
                });
            } else {
                document.getElementById("authView").style.display = "block";
            }
        });
    </script>
</body>
</html>
