version: "3.9"

# ── DOCKGE MANAGEMENT ──────────────────────────────────────────────────────────
# This compose file is managed by Dockge. Edit via the Dockge web UI at:
#   http://localhost:5001
#
# For CLI-only deployments, use compose.yaml instead.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Dockge (Docker Compose UI) ─────────────────────────────────────────────
  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
    networks:
      - fintrack-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fintrack
      POSTGRES_USER:     fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-107692_CBarson}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - fintrack-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-api
    restart: unless-stopped
    environment:
      DATABASE_URL:      postgresql+asyncpg://fintrack:${DB_PASSWORD:-107692_CBarson}@postgres:5432/fintrack
      DATABASE_URL_SYNC: postgresql://fintrack:${DB_PASSWORD:-107692_CBarson}@postgres:5432/fintrack
      JWT_SECRET:               ${JWT_SECRET:-107692_CBarson_ETTS_arson_2268_}
      JWT_ALGORITHM:            HS256
      JWT_ACCESS_EXPIRE_MINUTES: "30"
      JWT_REFRESH_EXPIRE_DAYS:  "30"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
      APP_VERSION: "1.0.0"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fintrack-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx + frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrack-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - fintrack-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  dockge_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fintrack-net:
    driver: bridge
