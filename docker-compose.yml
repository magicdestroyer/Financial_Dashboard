version: "3.9"

# ── USAGE ──────────────────────────────────────────────────────────────────────
# 1. Copy .env.example to .env and fill in real values
# 2. docker compose up -d --build
# 3. App available at http://localhost:8080
#    API docs at    http://localhost:8080/api/docs
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fintrack
      POSTGRES_USER:     fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-107692_CBarson}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Expose only on loopback so the DB isn't reachable from outside the host
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - fintrack-net

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-api
    restart: unless-stopped
    environment:
      # asyncpg driver for the app
      DATABASE_URL:      postgresql+asyncpg://fintrack:${DB_PASSWORD:-107692_CBarson}@postgres:5432/fintrack
      # psycopg2 (sync) driver for Alembic migrations
      DATABASE_URL_SYNC: postgresql://fintrack:${DB_PASSWORD:-107692_CBarson}@postgres:5432/fintrack

      JWT_SECRET:               ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM:            HS256
      JWT_ACCESS_EXPIRE_MINUTES: "30"
      JWT_REFRESH_EXPIRE_DAYS:  "30"

      # Allow requests from the Nginx frontend (port 8080) and direct dev access
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}

      APP_VERSION: "1.0.0"

    # Only expose internally — Nginx proxies /api/* to this container
    expose:
      - "8000"
    # Uncomment if you need direct API access for debugging:
    # ports:
    #   - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    # Live-reload during development — comment out for production
    # volumes:
    #   - ./backend/app:/app/app

    networks:
      - fintrack-net

  # ── Nginx + frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrack-web
    restart: unless-stopped
    ports:
      # Host 8080 → container 8080 (non-root Nginx binds 8080 internally)
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - fintrack-net

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fintrack-net:
    driver: bridge